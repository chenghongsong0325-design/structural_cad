[pytest]
# 平行跑(pytest-xdist):測試彼此獨立(不共用檔案/全域狀態),吃滿 CPU 最省時間。
# 全套從 ~10 分鐘降到 ~2 分鐘。要看單一測試的完整輸出時用 `-p no:xdist -n0`。
addopts = -n auto -q

markers =
    slow: 隨機掃描/全定義域參數化這類慢測(改骨架時才需要全跑)。
        平常:pytest -m "not slow"(約 1 分鐘)
        改骨架後:pytest(全跑)+ python scripts/scan_plans.py --n 400 --seed 20260802

filterwarnings =
    ignore::DeprecationWarning:ezdxf.*
